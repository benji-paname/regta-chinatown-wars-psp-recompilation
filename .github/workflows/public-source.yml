name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/maintenance/check_publication.py --tree HEAD
      - run: python tools/maintenance/check_site.py
